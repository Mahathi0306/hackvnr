services:
  - type: web
    name: protomind-backend
    runtime: node
    rootDir: mah/backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        fromDatabase:
          name: protomind-db
          property: connectionString

  - type: web
    name: protomind-frontend
    runtime: static
    rootDir: mah/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://protomind-backend.onrender.com

databases:
  - name: protomind-db
    engine: mongodb
    version: "7.0"
    ipAllowList: []
